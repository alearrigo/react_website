<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alessandro Arrigo</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --blob-opacity: 0.1;
        }
        .light-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --blob-opacity: 0.15;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite alternate;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* Light theme color overrides */
        .light-theme .text-white {
            color: #1e293b !important;
        }
        .light-theme .text-slate-200 {
            color: #334155 !important;
        }
        .light-theme .text-slate-300 {
            color: #475569 !important;
        }
        .light-theme .text-slate-400 {
            color: #64748b !important;
        }
        .light-theme .text-slate-500 {
            color: #64748b !important;
        }
        .light-theme .bg-slate-900\/50 {
            background-color: rgba(226, 232, 240, 0.5) !important;
        }
        .light-theme .bg-slate-800 {
            background-color: #cbd5e1 !important;
        }
        .light-theme .border-slate-800 {
            border-color: #cbd5e1 !important;
        }
        .light-theme .border-slate-800\/50 {
            border-color: rgba(203, 213, 225, 0.5) !important;
        }
        .light-theme .hover\:text-white:hover {
            color: #0f172a !important;
        }
        .light-theme .from-white {
            --tw-gradient-from: #1e293b !important;
        }
        .light-theme .to-slate-400 {
            --tw-gradient-to: #64748b !important;
        }
    </style>
